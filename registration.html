
<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETHIO TAX LINK - Taxpayer Registration</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f5f8;
      color: #1d2939;
    }
    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 14px #00000012;
    }
    h1 { color: #075b43; text-align: center; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      background: #087451;
      color: white;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
    }
    .language { margin-bottom: 20px; }
    .notice {
      margin-top: 20px;
      padding: 12px;
      background: #fff4d6;
      border-radius: 7px;
      line-height: 1.6;
    }
    .home { display: block; margin-top: 20px; text-align: center; }
  </style>
</head>
<body>
  <main class="container">
    <div class="language">
      <label id="languageLabel" for="language">ቋንቋ ይምረጡ</label>
      <select id="language" onchange="changeLanguage()">
        <option value="am">አማርኛ</option>
        <option value="en">English</option>
        <option value="om">Afaan Oromo</option>
      </select>
    </div>

    <h1 id="title">የግብር ከፋይ ምዝገባ</h1>
    <p id="intro">የሙከራ የግብር ከፋይ ምዝገባ ቅጽ</p>

    <form onsubmit="demoRegister(event)">
      <label id="nameLabel" for="fullName">ሙሉ ስም</label>
      <input id="fullName" type="text" required>

      <label id="typeLabel" for="taxpayerType">የግብር ከፋይ አይነት</label>
      <select id="taxpayerType" required>
        <option value="individual" id="individualOption">ግለሰብ</option>
        <option value="business" id="businessOption">ድርጅት / ንግድ</option>
      </select>

      <label id="emailLabel" for="email">ኢሜይል</label>
      <input id="email" type="email">

      <label id="phoneLabel" for="phone">ስልክ ቁጥር</label>
      <input id="phone" type="tel">

      <button id="submitButton" type="submit">የሙከራ ምዝገባ</button>
    </form>

    <div class="notice" id="notice">
      ማስታወሻ፦ ይህ የሙከራ ቅጽ ብቻ ነው።
      ከመንግሥት ወይም ከFayda ጋር አልተገናኘም።
      እውነተኛ TIN፣ Fayda ወይም የግል መረጃ አታስገቡ።
    </div>

    <a class="home" id="homeLink" href="index.html">ወደ መነሻ ገጽ ተመለስ</a>
  </main>

  <script>
    const translations = {
      am: {
        languageLabel: "ቋንቋ ይምረጡ",
        title: "የግብር ከፋይ ምዝገባ",
        intro: "የሙከራ የግብር ከፋይ ምዝገባ ቅጽ",
        nameLabel: "ሙሉ ስም",
        typeLabel: "የግብር ከፋይ አይነት",
        individualOption: "ግለሰብ",
        businessOption: "ድርጅት / ንግድ",
        emailLabel: "ኢሜይል",
        phoneLabel: "ስልክ ቁጥር",
        submitButton: "የሙከራ ምዝገባ",
        notice: "ማስታወሻ፦ ይህ የሙከራ ቅጽ ብቻ ነው። ከመንግሥት ወይም ከFayda ጋር አልተገናኘም። እውነተኛ TIN፣ Fayda ወይም የግል መረጃ አታስገቡ።",
        homeLink: "ወደ መነሻ ገጽ ተመለስ",
        success: "የሙከራ ቅጹ ተሞልቷል። መረጃው አልተቀመጠም።"
      },
      en: {
        languageLabel: "Select Language",
        title: "Taxpayer Registration",
        intro: "Demo taxpayer registration form",
        nameLabel: "Full Name",
        typeLabel: "Taxpayer Type",
        individualOption: "Individual",
        businessOption: "Company / Business",
        emailLabel: "Email",
        phoneLabel: "Phone Number",
        submitButton: "Demo Registration",
        notice: "Notice: This is a demo form only. It is not connected to government systems or Fayda. Do not enter real TIN, Fayda or personal information.",
        homeLink: "Return to Home",
        success: "Demo form completed. No information has been saved."
      },
      om: {
        languageLabel: "Afaan filadhu",
        title: "Galmee Kaffalaa Gibiraa",
        intro: "Unka galmee kaffalaa gibiraa yaalii",
        nameLabel: "Maqaa guutuu",
        typeLabel: "Gosa kaffalaa gibiraa",
        individualOption: "Nama dhuunfaa",
        businessOption: "Dhaabbata / Daldala",
        emailLabel: "Imeelii",
        phoneLabel: "Lakkoofsa bilbilaa",
        submitButton: "Galmee yaalii",
        notice: "Hubachiisa: Kun unka yaalii qofa. Sirna mootummaa ykn Fayda waliin hin walqabanne. TIN, Fayda ykn odeeffannoo dhuunfaa dhugaa hin galchin.",
        homeLink: "Gara fuula jalqabaatti deebi'i",
        success: "Unki yaalii guutameera. Odeeffannoon hin kuufamne."
      }
    };

    function changeLanguage() {
      const lang = document.getElementById("language").value;
      const t = translations[lang];
      document.documentElement.lang = lang;

      Object.keys(t).forEach(function(id) {
        if (id !== "success") {
          document.getElementById(id).textContent = t[id];
        }
      });
    }

    function demoRegister(event) {
      event.preventDefault();
      const lang = document.getElementById("language").value;
      alert(translations[lang].success);
    }
  </script>
</body>
</html>
