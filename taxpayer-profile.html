
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETHIO TAX LINK - Taxpayer Profile</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f5f9;margin:0;padding:20px;color:#172b4d}
.container{max-width:650px;margin:20px auto;background:white;padding:22px;border-radius:14px;box-shadow:0 3px 15px #0001}
h1{text-align:center;color:#126b45}
label{display:block;margin-top:14px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:7px;box-sizing:border-box;font-size:16px}
button{width:100%;padding:13px;margin-top:18px;background:#126b45;color:white;border:0;border-radius:8px;font-size:16px}
button:disabled{opacity:.6}
.notice{background:#fff5d8;padding:12px;border-radius:8px;font-size:14px}
#result{margin-top:18px;padding:12px;background:#e8f5ed;border-radius:8px;display:none;overflow-wrap:anywhere}
a{color:#126b45}
.section-title{margin-top:25px;color:#126b45;border-bottom:1px solid #ddd;padding-bottom:8px}
</style>
</head>
<body>
<div class="container">

<h1>ETHIO TAX LINK</h1>
<h2 id="title">የታክስ ከፋይ መገለጫ</h2>

<label id="languageLabel">ቋንቋ ምረጥ</label>
<select id="language" onchange="changeLanguage()">
<option value="am">አማርኛ</option>
<option value="en">English</option>
<option value="om">Afaan Oromo</option>
</select>

<p class="notice" id="notice">
ማሳሰቢያ፦ ይህ የሙከራ ገጽ ነው። እውነተኛ TIN ወይም Fayda መረጃ አታስገቡ።
</p>

<form id="profileForm">

<h3 class="section-title" id="basicTitle">መሠረታዊ መረጃ</h3>

<label id="typeLabel">የታክስ ከፋይ ዓይነት</label>
<select id="type" required onchange="changeTaxpayerType()">
<option value="individual" id="individualOption">ግለሰብ</option>
<option value="business" id="businessOption">ድርጅት</option>
</select>

<label id="categoryLabel">የታክስ ከፋይ ምድብ</label>
<select id="category" required>
<option value="">-- ምረጥ --</option>
<option value="individual">ግለሰብ</option>
<option value="merchant">ነጋዴ</option>
<option value="small_business">አነስተኛ ንግድ</option>
<option value="private_company">የግል ድርጅት</option>
<option value="share_company">አክሲዮን ማህበር</option>
<option value="transport_business">የትራንስፖርት ድርጅት</option>
<option value="other">ሌላ</option>
</select>

<label id="nameLabel">ሙሉ ስም / የድርጅት ስም</label>
<input id="fullName" type="text" required>

<label id="tinLabel">የTIN ቁጥር</label>
<input id="tin" type="text">

<div id="licenseSection" style="display:none">
<label id="licenseLabel">የንግድ ፈቃድ ቁጥር</label>
<input id="license" type="text">
</div>

<h3 class="section-title" id="businessTitle">የኢኮኖሚ ዘርፍ</h3>

<label id="sectorLabel">የንግድ / የሥራ ዘርፍ</label>
<select id="sector">
<option value="">-- ምረጥ --</option>
<option value="agriculture">ግብርና</option>
<option value="transport">ትራንስፖርት</option>
<option value="industry">ኢንዱስትሪ</option>
<option value="trade">ንግድ</option>
<option value="services">አገልግሎት</option>
<option value="construction">ግንባታ</option>
<option value="technology">ቴክኖሎጂ</option>
<option value="other">ሌላ</option>
</select>

<h3 class="section-title" id="contactTitle">የመገናኛ መረጃ</h3>

<label id="emailLabel">ኢሜይል</label>
<input id="email" type="email" readonly>

<label id="phoneLabel">ስልክ ቁጥር</label>
<input id="phone" type="tel">

<label id="cityLabel">ከተማ</label>
<input id="city" type="text">

<h3 class="section-title" id="registrationTitle">የምዝገባ መረጃ</h3>

<label id="methodLabel">የምዝገባ ዘዴ</label>
<select id="registrationMethod" disabled>
<option value="self">ራስ-ምዝገባ</option>
</select>

<p class="notice" id="methodNotice">
ይህ መገለጫ በራስዎ እየተመዘገበ ነው። በባለሙያ የሚደረግ ምዝገባ በተለየ የፈቃድ ስርዓት ይተዳደራል።
</p>

<button type="submit" id="saveButton">መረጃውን አስቀምጥ</button>
</form>

<div id="result" role="status"></div>

<p><a href="dashboard.html" id="dashboardLink">ወደ Dashboard ተመለስ</a></p>
<p><a href="index.html" id="homeLink">ዋና ገጽ</a></p>

</div>

const categoryValues=["","individual","merchant","small_business","private_company","share_company","transport_business","other"];
const sectorValues=["","agriculture","transport","industry","trade","services","construction","technology","other"];

function setOptions(id,labels,values){
const select=document.getElementById(id);
const oldValue=select.value;
select.innerHTML="";
labels.forEach((label,index)=>{
const option=document.createElement("option");
option.value=values[index];
option.textContent=label;
select.appendChild(option);
});
if(values.includes(oldValue)) select.value=oldValue;
}

function changeLanguage(){
const language=document.getElementById("language").value;
const t=translations[language];

Object.keys(t).forEach(id=>{
const element=document.getElementById(id);
if(element && typeof t[id]==="string") element.textContent=t[id];
});

setOptions("category",t.categoryOptions,categoryValues);
setOptions("sector",t.sectorOptions,sectorValues);
changeTaxpayerType();
}

function changeTaxpayerType(){
const type=document.getElementById("type").value;
const licenseSection=document.getElementById("licenseSection");
const license=document.getElementById("license");

if(type==="business"){
licenseSection.style.display="block";
license.required=true;
}else{
licenseSection.style.display="none";
license.required=false;
license.value="";
}
}
</script>

<script type="module">
import { supabase } from "./supabase-config.js";

const form=document.getElementById("profileForm");
const result=document.getElementById("result");
const saveButton=document.getElementById("saveButton");

let currentUser=null;

function showMessage(message,isError=false){
result.textContent=message;
result.style.display="block";
result.style.background=isError?"#fde8e8":"#e8f5ed";
}

async function initializeProfile(){
try{
const {data,error}=await supabase.auth.getSession();

if(error || !data.session){
window.location.replace("signup.html");
return;
}

currentUser=data.session.user;
document.getElementById("email").value=currentUser.email || "";

const {data:profile,error:profileError}=await supabase
.from("taxpayers")
.select("*")
.eq("user_id",currentUser.id)
.maybeSingle();

if(profileError) throw profileError;

if(profile){
document.getElementById("type").value=profile.taxpayer_type || "individual";
document.getElementById("fullName").value=profile.full_name || "";
document.getElementById("tin").value=profile.tin || "";
document.getElementById("license").value=profile.business_license || "";
document.getElementById("phone").value=profile.phone || "";
document.getElementById("city").value=profile.city || "";
document.getElementById("category").value=profile.taxpayer_category || "";
document.getElementById("sector").value=profile.business_sector || "";
document.getElementById("registrationMethod").value=profile.registration_method || "self";
}

changeTaxpayerType();

}catch(error){
console.error(error);
showMessage("Profile loading error: "+error.message,true);
}
}

form.addEventListener("submit",async function(event){
event.preventDefault();

if(!currentUser){
showMessage("Please log in first.",true);
return;
}

saveButton.disabled=true;
const language=document.getElementById("language").value;
saveButton.textContent=translations[language].loading;

const profileData={
user_id:currentUser.id,
taxpayer_type:document.getElementById("type").value,
taxpayer_category:document.getElementById("category").value || null,
business_sector:document.getElementById("sector").value || null,
registration_method:"self",
full_name:document.getElementById("fullName").value.trim(),
tin:document.getElementById("tin").value.trim() || null,
business_license:document.getElementById("type").value==="business"
? document.getElementById("license").value.trim() || null
: null,
email:currentUser.email || null,
phone:document.getElementById("phone").value.trim() || null,
city:document.getElementById("city").value.trim() || null
};

try{
const {data:existing,error:checkError}=await supabase
.from("taxpayers")
.select("id")
.eq("user_id",currentUser.id)
.maybeSingle();

if(checkError) throw checkError;

let saveResult;

if(existing){
saveResult=await supabase
.from("taxpayers")
.update(profileData)
.eq("user_id",currentUser.id);
}else{
saveResult=await supabase
.from("taxpayers")
.insert(profileData);
}

if(saveResult.error) throw saveResult.error;

showMessage(translations[language].success);

}catch(error){
console.error(error);
showMessage(translations[language].error+" "+error.message,true);
}finally{
saveButton.disabled=false;
saveButton.textContent=translations[document.getElementById("language").value].saveButton;
}
});

initializeProfile();
</script>
